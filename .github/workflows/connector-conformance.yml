name: Advisory connector conformance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  connector:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Bind subject and public state
        run: |
          echo "SUBJECT_SHA=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"
          if test "${{ github.event_name }}" = push && test "${{ github.ref }}" = refs/heads/main; then echo "PUBLIC_STATE=MAIN_MERGED" >> "$GITHUB_ENV"; else echo "PUBLIC_STATE=PR_CANDIDATE" >> "$GITHUB_ENV"; fi
      - name: Acquire immutable promotion and domain releases
        shell: bash
        run: |
          set -euo pipefail
          lock=contracts/release-locks-v1.json
          core_repo=$(jq -r .core.repository "$lock"); core_tag=$(jq -r .core.tag "$lock"); core_tag_object=$(jq -r .core.tag_object_sha "$lock"); core_target=$(jq -r .core.target_commit_sha "$lock"); core_asset=$(jq -r .core.asset.name "$lock"); core_sha=$(jq -r .core.asset.sha256 "$lock")
          gh api "repos/$core_repo/git/ref/tags/$core_tag" > "$RUNNER_TEMP/core-ref.json"; jq -e --arg sha "$core_tag_object" '.object.type=="tag" and .object.sha==$sha' "$RUNNER_TEMP/core-ref.json" >/dev/null; gh api "repos/$core_repo/git/tags/$core_tag_object" > "$RUNNER_TEMP/core-tag.json"; jq -e --arg sha "$core_target" '.object.type=="commit" and .object.sha==$sha' "$RUNNER_TEMP/core-tag.json" >/dev/null; gh api "repos/$core_repo/releases/tags/$core_tag" > "$RUNNER_TEMP/core-release.json"; core_id=$(jq -r --arg name "$core_asset" '.assets[]|select(.name==$name)|.id' "$RUNNER_TEMP/core-release.json"); gh api -H 'Accept: application/octet-stream' "repos/$core_repo/releases/assets/$core_id" > "$RUNNER_TEMP/$core_asset"; printf '%s  %s\n' "$core_sha" "$RUNNER_TEMP/$core_asset" | sha256sum -c -; mkdir -p "$RUNNER_TEMP/core"; tar -xzf "$RUNNER_TEMP/$core_asset" -C "$RUNNER_TEMP/core"; chmod +x "$RUNNER_TEMP/core/gooo"
          promotion_repo=$(jq -r .promotion.repository "$lock"); promotion_tag=$(jq -r .promotion.tag "$lock"); promotion_tag_object=$(jq -r .promotion.tag_object_sha "$lock"); promotion_target=$(jq -r .promotion.target_commit_sha "$lock"); promotion_asset=$(jq -r .promotion.asset.name "$lock"); promotion_sha=$(jq -r .promotion.asset.sha256 "$lock")
          gh api "repos/$promotion_repo/git/ref/tags/$promotion_tag" > "$RUNNER_TEMP/promotion-ref.json"; jq -e --arg sha "$promotion_tag_object" '.object.type=="tag" and .object.sha==$sha' "$RUNNER_TEMP/promotion-ref.json" >/dev/null; gh api "repos/$promotion_repo/git/tags/$promotion_tag_object" > "$RUNNER_TEMP/promotion-tag.json"; jq -e --arg sha "$promotion_target" '.object.type=="commit" and .object.sha==$sha' "$RUNNER_TEMP/promotion-tag.json" >/dev/null; gh api "repos/$promotion_repo/releases/tags/$promotion_tag" > "$RUNNER_TEMP/promotion-release.json"; promotion_id=$(jq -r --arg name "$promotion_asset" '.assets[]|select(.name==$name)|.id' "$RUNNER_TEMP/promotion-release.json"); gh api -H 'Accept: application/octet-stream' "repos/$promotion_repo/releases/assets/$promotion_id" > "$RUNNER_TEMP/promotion.json"; printf '%s  %s\n' "$promotion_sha" "$RUNNER_TEMP/promotion.json" | sha256sum -c -; jq -e '.decision=="CONNECTOR_PROMOTION_ELIGIBLE" and .promotion.state=="ELIGIBLE" and .promotion.connector_implementation=="NOT_STARTED"' "$RUNNER_TEMP/promotion.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/domain-inputs" "$RUNNER_TEMP/release-observations"
          while IFS= read -r consumer; do id=$(jq -r .id <<<"$consumer"); repo=$(jq -r .repository <<<"$consumer"); tag=$(jq -r .tag <<<"$consumer"); tag_object=$(jq -r .tag_object_sha <<<"$consumer"); target=$(jq -r .target_commit_sha <<<"$consumer"); asset=$(jq -r .archive.name <<<"$consumer"); digest=$(jq -r .archive.sha256 <<<"$consumer"); gh api "repos/$repo/git/ref/tags/$tag" > "$RUNNER_TEMP/$id-ref.json"; jq -e --arg sha "$tag_object" '.object.type=="tag" and .object.sha==$sha' "$RUNNER_TEMP/$id-ref.json" >/dev/null; gh api "repos/$repo/git/tags/$tag_object" > "$RUNNER_TEMP/$id-tag.json"; jq -e --arg sha "$target" '.object.type=="commit" and .object.sha==$sha' "$RUNNER_TEMP/$id-tag.json" >/dev/null; gh api "repos/$repo/releases/tags/$tag" > "$RUNNER_TEMP/$id-release.json"; asset_id=$(jq -r --arg name "$asset" '.assets[]|select(.name==$name)|.id' "$RUNNER_TEMP/$id-release.json"); gh api -H 'Accept: application/octet-stream' "repos/$repo/releases/assets/$asset_id" > "$RUNNER_TEMP/$asset"; printf '%s  %s\n' "$digest" "$RUNNER_TEMP/$asset" | sha256sum -c -; mkdir -p "$RUNNER_TEMP/domain-inputs/$id"; unzip -q "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/domain-inputs/$id"; jq -S -n --arg id "$id" --arg repo "$repo" --arg tag "$tag" --arg target "$target" '{id:$id,repository:$repo,tag:$tag,target_commit_sha:$target,identity_verified:true,archive_verified:true}' > "$RUNNER_TEMP/release-observations/$id.json"; done < <(jq -c '.consumers[]' "$lock")
          jq -S -s '{schema:"gooo/advisory-connector/domain-release-observation/v1",consumers:.}' "$RUNNER_TEMP"/release-observations/*.json > "$RUNNER_TEMP/domain-releases.json"
      - name: Resolve connector activities through released Gooo
        shell: bash
        run: |
          set -euo pipefail
          gooo="$RUNNER_TEMP/core/gooo"; source=examples/connector/main.gooo; denominator=contracts/connector-denominator-v1.json
          "$gooo" check --json "$source" > "$RUNNER_TEMP/syntax.json"; "$gooo" check --semantic --json "$source" > "$RUNNER_TEMP/semantic.json"; "$gooo" graph dump "$source" > "$RUNNER_TEMP/graph.json"; jq -e '.status=="ok"' "$RUNNER_TEMP/syntax.json" "$RUNNER_TEMP/semantic.json" >/dev/null; jq -e '([.nodes[]|select(.kind=="Activity")]|length)==12' "$RUNNER_TEMP/graph.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/core-resolutions"; while IFS=$'\t' read -r ordinal activity; do printf -v receipt '%s/core-resolutions/%02d-%s.json' "$RUNNER_TEMP" "$ordinal" "$activity"; "$gooo" graph resolve-activity "$source" --name "$activity" > "$receipt"; jq -e --arg activity "$activity" '.schema=="gooo/activity-cardinality-resolution/v1" and .selector.name==$activity and .decision=="CLOSED" and .occurrences==1 and .claim.state=="CLOSED"' "$receipt" >/dev/null; done < <(jq -r '.cells[]|[.ordinal,.activity]|@tsv' "$denominator"); jq -S -s '.' "$RUNNER_TEMP"/core-resolutions/*.json > "$RUNNER_TEMP/core-receipts.json"
      - name: Connect, conform, and challenge portfolio graph
        shell: bash
        run: |
          set -euo pipefail
          snapshot(){ find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -print0|sort -z|xargs -0 sha256sum|sha256sum|awk '{print $1}'; }
          before=$(snapshot); connector=scripts/connect.sh; conformer=scripts/conform.sh
          start_ns=$(date +%s%N); /usr/bin/time -f '%M' -o "$RUNNER_TEMP/connector-rss" bash "$connector" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/domain-inputs" "$RUNNER_TEMP/output-a" "$SUBJECT_SHA"; end_ns=$(date +%s%N); echo $(( (end_ns-start_ns)/1000000 )) > "$RUNNER_TEMP/connector-wall-ms"
          bash "$connector" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/domain-inputs" "$RUNNER_TEMP/output-b" "$SUBJECT_SHA"; bash "$conformer" "$RUNNER_TEMP/output-a" "$RUNNER_TEMP/output-b" "$RUNNER_TEMP/conformance.json"; jq -e '.decision=="CONFORMANT" and .summary.closed==6 and .summary.total==6' "$RUNNER_TEMP/conformance.json" >/dev/null
          cp -R "$RUNNER_TEMP/output-a" "$RUNNER_TEMP/bad-checksum-a"; cp -R "$RUNNER_TEMP/output-a" "$RUNNER_TEMP/bad-checksum-b"; printf '\n' >> "$RUNNER_TEMP/bad-checksum-a/portfolio.json"; printf '\n' >> "$RUNNER_TEMP/bad-checksum-b/portfolio.json"; bash "$conformer" "$RUNNER_TEMP/bad-checksum-a" "$RUNNER_TEMP/bad-checksum-b" "$RUNNER_TEMP/checksum-mismatch.json"; jq -e '.decision=="FAIL_CLOSED" and .summary.closed==5 and .summary.refuted==1 and .claim.reason=="SHA256_CHECKSUM_MISMATCH"' "$RUNNER_TEMP/checksum-mismatch.json" >/dev/null
          after=$(snapshot); if test "$before" = "$after"; then writes=0; else writes=1; fi; jq -S -n --arg subject_sha "$SUBJECT_SHA" --arg before "$before" --arg after "$after" --argjson writes "$writes" --argjson rss "$(cat "$RUNNER_TEMP/connector-rss")" --argjson wall "$(cat "$RUNNER_TEMP/connector-wall-ms")" '{schema:"gooo/advisory-connector/runtime/v1",subject_sha:$subject_sha,connector:{peak_rss_kib:$rss,wall_ms:$wall},repository:{before_digest:$before,after_digest:$after,writes:$writes},deterministic_replay:true,local_tests_run:0}' > "$RUNNER_TEMP/runtime.json"
          bash scripts/observe.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/promotion.json" "$RUNNER_TEMP/domain-releases.json" "$RUNNER_TEMP/domain-inputs" "$RUNNER_TEMP/output-a" "$RUNNER_TEMP/conformance.json" "$RUNNER_TEMP/checksum-mismatch.json" "$RUNNER_TEMP/runtime.json" 0 "$PUBLIC_STATE" "$RUNNER_TEMP/facts.json"; bash scripts/evaluate.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/core-receipts.json" "$RUNNER_TEMP/facts.json" "$RUNNER_TEMP/connector-report.json" "$SUBJECT_SHA"
          jq -e --arg state "$PUBLIC_STATE" '.decision=="CONNECTOR_CONFORMANT" and .summary=={closed:12,edges:3,nodes:4,output_files:5,refuted:0,total:12,unknown:0,unknown_relations:0} and .implementation.state==$state and .implementation.effect=="READ_ONLY" and .implementation.cross_project_required_gates==0 and ([.proofs[]|select(.closed==4 and .total==4)]|length)==3 and .indicator_classes==[{class:"OUTCOME",closed:3,total:3},{class:"DRIVER",closed:5,total:5},{class:"GUARDRAIL",closed:4,total:4}] and .runtime.repository.writes==0 and .runtime.local_tests_run==0' "$RUNNER_TEMP/connector-report.json" >/dev/null
          cp -R "$RUNNER_TEMP/domain-inputs" "$RUNNER_TEMP/unknown-inputs"; jq -c '.state="UNKNOWN"|.evidence.observed_sha256=null|.stage="EVIDENCE"|.step="REFRESH_RELEASE_RELATION"|.reason="RELEASE_RELATION_EVIDENCE_UNAVAILABLE"|.unknown_class="EVIDENCE_MISSING"|.next_operation="REFRESH_RELEASE_EVIDENCE"' "$RUNNER_TEMP/unknown-inputs/local-ledger/bundle-a/relations.ndjson" > "$RUNNER_TEMP/unknown-relation.next"; mv "$RUNNER_TEMP/unknown-relation.next" "$RUNNER_TEMP/unknown-inputs/local-ledger/bundle-a/relations.ndjson"; bash "$connector" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/unknown-inputs" "$RUNNER_TEMP/unknown-a" "$SUBJECT_SHA"; bash "$connector" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/unknown-inputs" "$RUNNER_TEMP/unknown-b" "$SUBJECT_SHA"; bash "$conformer" "$RUNNER_TEMP/unknown-a" "$RUNNER_TEMP/unknown-b" "$RUNNER_TEMP/unknown-conformance.json"; bash scripts/observe.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/promotion.json" "$RUNNER_TEMP/domain-releases.json" "$RUNNER_TEMP/unknown-inputs" "$RUNNER_TEMP/unknown-a" "$RUNNER_TEMP/unknown-conformance.json" "$RUNNER_TEMP/checksum-mismatch.json" "$RUNNER_TEMP/runtime.json" 0 "$PUBLIC_STATE" "$RUNNER_TEMP/unknown-facts.json"; bash scripts/evaluate.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/core-receipts.json" "$RUNNER_TEMP/unknown-facts.json" "$RUNNER_TEMP/unknown-report.json" "$SUBJECT_SHA"; jq -e '.decision=="INCOMPLETE" and .summary.closed==11 and .summary.unknown==1 and .summary.unknown_relations==1 and .claim.stage=="EVIDENCE" and .claim.step=="REFRESH_RELEASE_RELATION" and .claim.reason=="RELEASE_RELATION_EVIDENCE_UNAVAILABLE" and .claim.unknown_class=="EVIDENCE_MISSING" and .claim.next_operation=="REFRESH_RELEASE_EVIDENCE"' "$RUNNER_TEMP/unknown-report.json" >/dev/null
          cp -R "$RUNNER_TEMP/domain-inputs" "$RUNNER_TEMP/mismatch-inputs"; jq -c '.right.id="gooo://interchange/specification/mismatched"' "$RUNNER_TEMP/mismatch-inputs/design-evidence/bundle-a/relations.ndjson" > "$RUNNER_TEMP/mismatch.next"; mv "$RUNNER_TEMP/mismatch.next" "$RUNNER_TEMP/mismatch-inputs/design-evidence/bundle-a/relations.ndjson"; bash "$connector" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/mismatch-inputs" "$RUNNER_TEMP/mismatch-a" "$SUBJECT_SHA"; bash "$connector" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/mismatch-inputs" "$RUNNER_TEMP/mismatch-b" "$SUBJECT_SHA"; bash "$conformer" "$RUNNER_TEMP/mismatch-a" "$RUNNER_TEMP/mismatch-b" "$RUNNER_TEMP/mismatch-conformance.json"; bash scripts/observe.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/promotion.json" "$RUNNER_TEMP/domain-releases.json" "$RUNNER_TEMP/mismatch-inputs" "$RUNNER_TEMP/mismatch-a" "$RUNNER_TEMP/mismatch-conformance.json" "$RUNNER_TEMP/checksum-mismatch.json" "$RUNNER_TEMP/runtime.json" 0 "$PUBLIC_STATE" "$RUNNER_TEMP/mismatch-facts.json"; bash scripts/evaluate.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/core-receipts.json" "$RUNNER_TEMP/mismatch-facts.json" "$RUNNER_TEMP/mismatch-report.json" "$SUBJECT_SHA"; jq -e '.decision=="FAIL_CLOSED" and .summary.closed==7 and .summary.refuted==5 and .claim.stage=="SPEC_ANCHOR" and .claim.reason=="SHARED_SPECIFICATION_ANCHOR_MISMATCH"' "$RUNNER_TEMP/mismatch-report.json" >/dev/null
          cp -R "$RUNNER_TEMP/domain-inputs" "$RUNNER_TEMP/missing-inputs"; mv "$RUNNER_TEMP/missing-inputs/infra-evidence" "$RUNNER_TEMP/infra-held"; set +e; bash "$connector" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/missing-inputs" "$RUNNER_TEMP/missing-output" "$SUBJECT_SHA"; missing_status=$?; set -e; test "$missing_status" -ne 0; bash scripts/observe.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/promotion.json" "$RUNNER_TEMP/domain-releases.json" "$RUNNER_TEMP/missing-inputs" "$RUNNER_TEMP/missing-output" "$RUNNER_TEMP/no-conformance.json" "$RUNNER_TEMP/checksum-mismatch.json" "$RUNNER_TEMP/runtime.json" "$missing_status" "$PUBLIC_STATE" "$RUNNER_TEMP/missing-facts.json"; bash scripts/evaluate.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/core-receipts.json" "$RUNNER_TEMP/missing-facts.json" "$RUNNER_TEMP/missing-report.json" "$SUBJECT_SHA"; jq -e '.decision=="INCOMPLETE" and .summary.closed==4 and .summary.unknown==8 and .claim.stage=="INPUT" and .claim.reason=="CANONICAL_INPUT_BUNDLE_UNAVAILABLE"' "$RUNNER_TEMP/missing-report.json" >/dev/null
          jq '.promotion.state="UNKNOWN"' "$RUNNER_TEMP/promotion.json" > "$RUNNER_TEMP/unpromoted.json"; bash scripts/observe.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/unpromoted.json" "$RUNNER_TEMP/domain-releases.json" "$RUNNER_TEMP/domain-inputs" "$RUNNER_TEMP/output-a" "$RUNNER_TEMP/conformance.json" "$RUNNER_TEMP/checksum-mismatch.json" "$RUNNER_TEMP/runtime.json" 0 "$PUBLIC_STATE" "$RUNNER_TEMP/unpromoted-facts.json"; bash scripts/evaluate.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/core-receipts.json" "$RUNNER_TEMP/unpromoted-facts.json" "$RUNNER_TEMP/unpromoted-report.json" "$SUBJECT_SHA"; jq -e '.decision=="FAIL_CLOSED" and .summary.closed==2 and .summary.refuted==10 and .claim.stage=="PROMOTION" and .claim.reason=="PROMOTION_NOT_ELIGIBLE"' "$RUNNER_TEMP/unpromoted-report.json" >/dev/null
          jq '.[0].decision="FIXED_POINT"' "$RUNNER_TEMP/core-receipts.json" > "$RUNNER_TEMP/invalid-core.json"; bash scripts/evaluate.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/invalid-core.json" "$RUNNER_TEMP/facts.json" "$RUNNER_TEMP/invalid-core-report.json" "$SUBJECT_SHA"; jq -e '.decision=="FAIL_CLOSED" and .summary.closed==0 and .summary.refuted==12 and .claim.stage=="RESOLUTION" and .claim.reason=="UNRECOGNIZED_CORE_ACTIVITY_RESOLUTION_DECISION"' "$RUNNER_TEMP/invalid-core-report.json" >/dev/null
          { echo '## Advisory connector'; jq -r '"- decision: \(.decision)","- implementation: \(.implementation.state)","- meta cells: \(.summary.closed)/\(.summary.total)","- output files: \(.summary.output_files)/5","- nodes: \(.summary.nodes)","- edges: \(.summary.edges)","- UNKNOWN relations: \(.summary.unknown_relations)","- proofs: "+([.proofs[]|"\(.choice) \(.closed)/\(.total)"]|join(", ")),"- indicators: "+([.indicator_classes[]|"\(.class) \(.closed)/\(.total)"]|join(", ")),"- repository writes: \(.runtime.repository.writes)","- external required gates: \(.implementation.cross_project_required_gates)","- local test executions: \(.runtime.local_tests_run)","- connector peak RSS: \(.runtime.connector.peak_rss_kib) KiB","- connector wall time: \(.runtime.connector.wall_ms) ms"' "$RUNNER_TEMP/connector-report.json"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload connector evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: advisory-connector-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/output-a
            ${{ runner.temp }}/output-b
            ${{ runner.temp }}/connector-report.json
            ${{ runner.temp }}/unknown-report.json
            ${{ runner.temp }}/mismatch-report.json
            ${{ runner.temp }}/missing-report.json
            ${{ runner.temp }}/unpromoted-report.json
            ${{ runner.temp }}/invalid-core-report.json
            ${{ runner.temp }}/conformance.json
            ${{ runner.temp }}/checksum-mismatch.json
            ${{ runner.temp }}/facts.json
            ${{ runner.temp }}/runtime.json
            ${{ runner.temp }}/graph.json
